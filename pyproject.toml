[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-soft-skills-laboratory"
version = "0.1.0"
description = "An executable textbook for observable professional behavior"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
soft-skills-lab = "soft_skills_lab.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
